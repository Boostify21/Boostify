<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming & Currencies - Boostify</title>
    <link rel="icon" type="image/png" href="circle.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #fff; text-align: center; margin: 0; padding: 20px; }
        
        /* Back to Home Link */
        .back-link { display: inline-block; text-align: left; max-width: 900px; width: 100%; margin: 0 auto 15px auto; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #ec4899; }

        .logo-box { width: 90px; height: 90px; margin: 0 auto 10px auto; background: #1e293b; border-radius: 50%; border: 2px solid #334155; overflow: hidden; }
        .logo { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 1.5rem; margin-bottom: 25px; color: #ec4899; }
        
        /* Main Toggle Trigger & Hub Cards */
        .toggle-card, .hub-card { 
            background: #1e293b; 
            padding: 18px 24px; 
            border-radius: 12px; 
            border: 1px solid #334155; 
            max-width: 900px; 
            margin: 0 auto 15px auto; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            cursor: pointer; 
            transition: 0.3s; 
            color: #fff; 
            text-decoration: none;
        }
        .toggle-card:hover, .hub-card:hover { border-color: #ec4899; background: #223049; }
        
        .card-left { display: flex; align-items: center; gap: 14px; text-align: left; }
        .card-left i { font-size: 1.4rem; color: #ec4899; min-width: 25px; text-align: center; }
        .card-left h3 { margin: 0; font-size: 1rem; font-weight: 500; }
        
        .chevron { transition: transform 0.3s ease; color: #94a3b8; }
        .toggle-card.active .chevron { transform: rotate(180deg); color: #ec4899; }
        .card-action { font-size: 0.8rem; color: #38bdf8; font-weight: 600; }

        /* Smooth Expandable Section */
        .expandable-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out;
            opacity: 0;
            max-width: 900px;
            margin: 0 auto;
        }
        .expandable-content.show {
            max-height: 1200px;
            opacity: 1;
            margin-bottom: 20px;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
        .grid .hub-card { margin: 0; }
    </style>
</head>
<body>
    
    <div style="max-width: 900px; margin: auto;">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
    
    <div class="logo-box"><img src="circle.png" class="logo" alt="Logo"></div>
    <h1>Gaming & Currencies</h1>

    <!-- 1. Gaming Currencies Accordion -->
    <div class="toggle-card" onclick="toggleDropdown('currenciesList', this)">
        <div class="card-left">
            <i class="fas fa-coins"></i>
            <h3>Gaming Currencies</h3>
        </div>
        <i class="fas fa-chevron-down chevron"></i>
    </div>

    <div class="expandable-content" id="currenciesList">
        <div class="grid">
            <a href="freefire.html" class="hub-card">
                <div class="card-left"><i class="fas fa-fire"></i><h3>Free Fire Diamonds</h3></div>
                <span class="card-action">View</span>
            </a>
            <a href="roblox.html" class="hub-card">
                <div class="card-left"><i class="fas fa-cube"></i><h3>Roblox Robux</h3></div>
                <span class="card-action">View</span>
            </a>
            <a href="valorant.html" class="hub-card">
                <div class="card-left"><i class="fas fa-shield-alt"></i><h3>Valorant Points</h3></div>
                <span class="card-action">View</span>
            </a>
            <a href="fortnite.html" class="hub-card">
                <div class="card-left"><i class="fas fa-crosshairs"></i><h3>Fortnite V-Bucks</h3></div>
                <span class="card-action">View</span>
            </a>
            <a href="pubg.html" class="hub-card">
                <div class="card-left"><i class="fas fa-plane"></i><h3>PUBG UC</h3></div>
                <span class="card-action">View</span>
            </a>
            <a href="pes.html" class="hub-card">
                <div class="card-left"><i class="fas fa-futbol"></i><h3>PES / eFootball Coins</h3></div>
                <span class="card-action">View</span>
            </a>
            <a href="other-games.html" class="hub-card">
                <div class="card-left"><i class="fas fa-gamepad"></i><h3>Other Games</h3></div>
                <span class="card-action">View</span>
            </a>
        </div>
    </div>

    <!-- 2. Steam Offline Accounts Direct Card -->
    <a href="steam-offline.html" class="hub-card" style="cursor: pointer;">
        <div class="card-left">
            <i class="fab fa-steam"></i>
            <h3>Steam Offline Accounts</h3>
        </div>
        <span class="card-action">View</span>
    </a>

    <script>
        function toggleDropdown(contentId, element) {
            element.classList.toggle('active');
            const content = document.getElementById(contentId);
            content.classList.toggle('show');
        }
    </script>
</body>
</html>
