<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boostify Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="circle.png">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .logo-box { width: 150px; height: 150px; margin: 0 auto; background: #1e293b; border-radius: 50%; border: 2px solid #334155; overflow: hidden; margin-bottom: 20px; }
        .logo { width: 100%; height: 100%; object-fit: cover; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 30px; border-radius: 15px; border: 1px solid #334155; transition: 0.3s; }
        .card:hover { border-color: #ec4899; }
        .card i { font-size: 3rem; color: #ec4899; margin-bottom: 15px; }
        .btn { background: #ec4899; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="logo-box"><img src="circle.png" class="logo"></div>
    <h1>Boostify Marketplace</h1>
    <div class="grid">
        <div class="card"><i class="fab fa-instagram"></i><h3>Instagram</h3><a href="instagram.html" class="btn">View Packages</a></div>
        <div class="card"><i class="fab fa-tiktok"></i><h3>TikTok</h3><a href="tiktok.html" class="btn">View Packages</a></div>
        <div class="card"><i class="fab fa-facebook"></i><h3>Facebook</h3><a href="facebook.html" class="btn">View Packages</a></div>
        <div class="card"><i class="fab fa-reddit"></i><h3>Reddit</h3><a href="reddit.html" class="btn">View Packages</a></div>
        <div class="card"><i class="fab fa-twitter"></i><h3>Twitter</h3><a href="twitter.html" class="btn">View Packages</a></div>
    </div>
</body>
</html>
