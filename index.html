<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostify Marketplace - Hub</title>
    <link rel="icon" type="image/png" href="circle.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #fff; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
        .logo-box { width: 120px; height: 120px; margin: 0 auto 15px auto; background: #1e293b; border-radius: 50%; border: 2px solid #334155; overflow: hidden; }
        .logo { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 2rem; margin-bottom: 5px; }
        p { color: #94a3b8; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; max-width: 950px; margin: auto; width: 100%; }
        .card { background: #1e293b; padding: 35px 20px; border-radius: 16px; border: 1px solid #334155; transition: 0.3s; text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; }
        .card:hover { border-color: #ec4899; transform: translateY(-5px); background: #223049; }
        .card i { font-size: 3rem; color: #ec4899; margin-bottom: 15px; }
        .card h3 { margin: 0 0 10px 0; font-size: 1.25rem; }
        .card p { font-size: 0.85rem; color: #64748b; margin: 0; }
    </style>
</head>
<body>
    <div class="logo-box"><img src="circle.png" class="logo" alt="Logo"></div>
    <h1>Boostify Marketplace</h1>
    <p>Select a main department to view available services.</p>

    <div class="grid">
        <a href="social-hub.html" class="card">
            <i class="fas fa-share-alt"></i>
            <h3>Social & Growth</h3>
            <p>Engagement, accounts, packs & ads sponsoring</p>
        </a>
        <a href="gaming-hub.html" class="card">
            <i class="fas fa-gamepad"></i>
            <h3>Gaming & Currencies</h3>
            <p>In-game money & Steam offline accounts</p>
        </a>
        <a href="digital-hub.html" class="card">
            <i class="fas fa-laptop-code"></i>
            <h3>Digital & Services</h3>
            <p>Subscriptions, AI, Windows, gift cards & web creation</p>
        </a>
    </div>
</body>
</html>
